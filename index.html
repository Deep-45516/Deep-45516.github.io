<title>Deep Lokhande</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: hero with a clean portrait panel, a proof strip of real numbers, then Projects, Skills, About, GitHub, Contact. Midnight ground, cyan as the working accent, coral as the single warm highlight. */
:root {
  --bg: #070c13;
  --bg2: #0a121b;
  --surface: #0f1923;
  --line: #1d2c3b;
  --fg: #eaf1f7;
  --muted: #8da2b5;
  --accent: #34d3ef;
  --accent-ink: #02171d;
  --warm: #ff6f5e;
  --ok: #3ddc97;
  --font-display: "Sora", "Segoe UI", system-ui, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --ease: cubic-bezier(.22, 1, .36, 1);
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f3f6f9; --bg2: #e9eff4; --surface: #ffffff; --line: #d2dce6;
    --fg: #0d1b27; --muted: #475c70; --accent: #0a7e96; --accent-ink: #ffffff; --warm: #d3402f; --ok: #11875a;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f3f6f9; --bg2: #e9eff4; --surface: #ffffff; --line: #d2dce6;
  --fg: #0d1b27; --muted: #475c70; --accent: #0a7e96; --accent-ink: #ffffff; --warm: #d3402f; --ok: #11875a;
  color-scheme: light;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 76px; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 400 1.0625rem/1.65 var(--font-body); -webkit-font-smoothing: antialiased; overflow-x: hidden;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--bg); }
img { display: block; }
a { color: inherit; }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.08; margin: 0; text-wrap: balance; letter-spacing: -.025em; }
p { margin: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }

.wrap {
  width: 100%; max-width: 1140px; margin-inline: auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.label { font: 500 .76rem/1 var(--font-mono); letter-spacing: .16em; text-transform: uppercase; color: var(--accent); display: inline-flex; align-items: center; gap: 10px; }
.label::before { content: ""; width: 28px; height: 1px; background: currentColor; }

/* ---------- header ---------- */
header.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50;
  background: color-mix(in srgb, var(--bg) 80%, transparent);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid color-mix(in srgb, var(--line) 70%, transparent);
}
header.top::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: linear-gradient(90deg, var(--accent), var(--warm)); transform-origin: 0 50%; transform: scaleX(var(--p, 0)); }
.bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; height: 62px; }
.mono-logo { font: 800 1rem/1 var(--font-display); text-decoration: none; width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; flex: none; background: var(--accent); color: var(--accent-ink); transition: transform .5s var(--ease); }
.mono-logo:hover { transform: rotate(-8deg) scale(1.06); }
nav.links { display: flex; align-items: center; gap: 2px; min-width: 0; overflow-x: auto; scrollbar-width: none; margin-left: auto; }
nav.links::-webkit-scrollbar { display: none; }
nav.links a { text-decoration: none; font-weight: 500; font-size: .92rem; color: var(--muted); padding: 8px 12px; border-radius: 999px; white-space: nowrap; transition: color .3s, background .3s; }
nav.links a:hover { color: var(--fg); }
nav.links a.on { color: var(--fg); background: color-mix(in srgb, var(--accent) 16%, transparent); }
.hire { font: 600 .88rem/1 var(--font-body); text-decoration: none; padding: 11px 16px; border-radius: 11px; background: var(--accent); color: var(--accent-ink); white-space: nowrap; flex: none; transition: transform .35s var(--ease), box-shadow .35s; }
.hire:hover { transform: translateY(-2px); box-shadow: 0 10px 26px -10px var(--accent); }
.icon-btn { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); display: grid; place-items: center; cursor: pointer; flex: none; transition: transform .4s var(--ease), border-color .3s; }
.icon-btn:hover { transform: rotate(18deg); border-color: var(--accent); }
.icon-btn svg { width: 18px; height: 18px; }

/* ---------- hero ---------- */
.hero { --sx: 70%; --sy: 20%; position: relative; padding-block: clamp(34px, 6vw, 84px) clamp(40px, 6vw, 72px); overflow: hidden; isolation: isolate; }
.hero::before {
  content: ""; position: absolute; inset: 0; z-index: -2;
  background: radial-gradient(640px circle at var(--sx) var(--sy), color-mix(in srgb, var(--accent) 14%, transparent), transparent 62%);
}
.grid-bg {
  position: absolute; inset: 0; z-index: -1; opacity: .5;
  background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size: 56px 56px; animation: gridmove 14s linear infinite;
  -webkit-mask-image: radial-gradient(ellipse 70% 60% at 60% 30%, #000 20%, transparent 75%); mask-image: radial-gradient(ellipse 70% 60% at 60% 30%, #000 20%, transparent 75%);
}
@keyframes gridmove { to { background-position: 56px 56px, 56px 56px; } }
.orb { position: absolute; border-radius: 50%; filter: blur(80px); pointer-events: none; z-index: -1; will-change: transform; }
.orb.a { width: 380px; height: 380px; right: -100px; top: -60px; background: color-mix(in srgb, var(--accent) 38%, transparent); transform: translateY(calc(var(--py, 0) * -.25px)); }
.orb.b { width: 320px; height: 320px; left: -120px; bottom: -120px; background: color-mix(in srgb, var(--warm) 30%, transparent); transform: translateY(calc(var(--py, 0) * .2px)); }
.hero-grid { display: grid; grid-template-columns: 1.1fr .9fr; gap: clamp(28px, 5vw, 72px); align-items: center; }
.hero-copy { min-width: 0; display: flex; flex-direction: column; gap: 22px; align-items: flex-start; }
.rise { animation: rise .9s var(--ease) both; animation-delay: var(--d, 0s); }
@keyframes rise { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }
.status { display: inline-flex; align-items: center; gap: 10px; padding: 9px 14px; border-radius: 999px; border: 1px solid color-mix(in srgb, var(--ok) 45%, var(--line)); background: color-mix(in srgb, var(--ok) 9%, transparent); font: 500 .8rem/1.2 var(--font-mono); }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ok); position: relative; flex: none; }
.dot::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: var(--ok); animation: ping 2s ease-out infinite; }
@keyframes ping { to { transform: scale(3.2); opacity: 0; } }
h1.name { font-size: clamp(2.8rem, 9vw, 5.9rem); font-weight: 800; letter-spacing: -.045em; line-height: 1; }
.ln { display: block; overflow: hidden; padding-bottom: .14em; margin-bottom: -.14em; }
.ln > span { display: inline-block; animation: up 1.1s var(--ease) both; animation-delay: var(--d, 0s); }
@keyframes up { from { transform: translateY(108%); } to { transform: none; } }
.grad { background: linear-gradient(100deg, var(--accent), var(--warm) 80%); background-size: 160% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent; }
.tagline { font: 600 clamp(1.15rem, 2.8vw, 1.55rem)/1.3 var(--font-display); letter-spacing: -.015em; max-width: 26ch; }
.now { font: 400 .95rem/1.4 var(--font-mono); color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.now b { color: var(--accent); font-weight: 500; }
.now b::after { content: ""; display: inline-block; width: 2px; height: 1.05em; margin-left: 3px; vertical-align: -.16em; background: var(--accent); animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.cta { display: flex; flex-wrap: wrap; gap: 12px; }
.btn {
  --mx: 0px; --my: 0px; position: relative; overflow: hidden;
  display: inline-flex; align-items: center; gap: 10px; text-decoration: none; cursor: pointer;
  font: 600 .96rem/1 var(--font-body); padding: 15px 22px; border-radius: 13px;
  border: 1px solid var(--line); background: var(--surface); color: var(--fg);
  transform: translate(var(--mx), var(--my));
  transition: transform .35s var(--ease), border-color .3s, box-shadow .4s;
}
.btn svg { width: 18px; height: 18px; flex: none; transition: transform .4s var(--ease); }
.btn:hover { border-color: var(--accent); }
.btn:hover svg.arrow { transform: translate(3px, -3px); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn.primary::after { content: ""; position: absolute; inset: 0; background: linear-gradient(105deg, transparent 30%, rgba(255,255,255,.45) 50%, transparent 70%); transform: translateX(-120%); transition: transform .8s var(--ease); }
.btn.primary:hover::after { transform: translateX(120%); }
.btn.primary:hover { box-shadow: 0 14px 34px -12px var(--accent); }
.quick { display: flex; flex-wrap: wrap; gap: 8px 22px; font: 400 .85rem/1.2 var(--font-mono); color: var(--muted); }
.quick span::before { content: "•"; color: var(--warm); margin-right: 8px; }

.portrait { position: relative; justify-self: center; width: min(400px, 100%); perspective: 1000px; }
.tilt { position: relative; transform: rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)); transition: transform .35s var(--ease); transform-style: preserve-3d; }
.photo { position: relative; border-radius: 26px; padding: 6px; background: linear-gradient(145deg, var(--accent), color-mix(in srgb, var(--accent) 10%, var(--line)) 45%, var(--warm)); box-shadow: 0 50px 90px -40px color-mix(in srgb, var(--accent) 55%, #000); animation: wipe 1.3s var(--ease) .1s both; }
@keyframes wipe { from { clip-path: inset(100% 0 0 0 round 26px); opacity: .2; } to { clip-path: inset(0 0 0 0 round 26px); opacity: 1; } }
.photo img { width: 100%; aspect-ratio: 3 / 4; object-fit: cover; object-position: 50% 30%; border-radius: 21px; background: var(--surface); animation: unzoom 1.8s var(--ease) .1s both; }
@keyframes unzoom { from { transform: scale(1.14); } to { transform: none; } }
.photo-shell { border-radius: 21px; overflow: hidden; }
.back-frame { position: absolute; inset: 0; border-radius: 26px; border: 2px solid color-mix(in srgb, var(--accent) 55%, transparent); transform: translate(16px, 16px); z-index: -1; animation: rise 1.2s var(--ease) .5s both; }
.chip-float { position: absolute; z-index: 3; display: flex; align-items: center; gap: 10px; padding: 11px 14px; border-radius: 14px; background: color-mix(in srgb, var(--surface) 92%, transparent); border: 1px solid var(--line); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); font: 500 .78rem/1.25 var(--font-mono); box-shadow: 0 20px 40px -18px #000c; animation: pop .8s var(--ease) both, float 5.5s ease-in-out infinite; }
.chip-float strong { font: 800 1.2rem/1 var(--font-display); color: var(--accent); letter-spacing: -.02em; }
.chip-float.c1 { left: -18px; bottom: 12%; animation-delay: 1.1s, 1.9s; }
.chip-float.c2 { right: -14px; top: 10%; animation-delay: 1.3s, 3.2s; }
@keyframes pop { from { opacity: 0; scale: .7; } to { opacity: 1; scale: 1; } }
@keyframes float { 0%, 100% { translate: 0 0; } 50% { translate: 0 -9px; } }

/* ---------- proof strip ---------- */
.proof { display: grid; grid-template-columns: repeat(4, 1fr); border: 1px solid var(--line); border-radius: 20px; background: var(--surface); overflow: hidden; }
.proof div { padding: 22px clamp(14px, 2.4vw, 28px); border-right: 1px solid var(--line); }
.proof div:last-child { border-right: 0; }
.proof strong { display: block; font: 800 clamp(1.9rem, 4.6vw, 2.9rem)/1 var(--font-display); letter-spacing: -.035em; font-variant-numeric: tabular-nums; }
.proof strong i { font-style: normal; color: var(--accent); }
.proof span { display: block; margin-top: 8px; font: 400 .78rem/1.35 var(--font-mono); color: var(--muted); }

/* ---------- sections ---------- */
section.band { padding-block: clamp(64px, 10vw, 116px); }
section.alt { background: var(--bg2); border-block: 1px solid var(--line); }
.head { display: flex; flex-direction: column; gap: 16px; margin-bottom: clamp(30px, 5vw, 54px); max-width: 760px; }
.head h2 { font-size: clamp(2rem, 5.4vw, 3.5rem); font-weight: 800; }
.head p { color: var(--muted); max-width: 56ch; }

.card { --mx: 50%; --my: 50%; position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: clamp(20px, 3vw, 28px); overflow: hidden; min-width: 0; transition: transform .5s var(--ease), border-color .3s; }
.card::after { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .4s; background: radial-gradient(380px circle at var(--mx) var(--my), color-mix(in srgb, var(--accent) 14%, transparent), transparent 60%); }
.card:hover { transform: translateY(-5px); border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); }
.card:hover::after { opacity: 1; }
.card > * { position: relative; z-index: 1; }
.card h3 { font-size: 1.25rem; margin-bottom: 4px; }
.meta { font: 400 .8rem/1.4 var(--font-mono); color: var(--accent); margin-bottom: 14px; }
.card ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; color: var(--muted); }
.card li { padding-left: 20px; position: relative; }
.card li::before { content: ""; position: absolute; left: 0; top: .72em; width: 8px; height: 2px; background: var(--warm); }
.card li strong { color: var(--fg); font-weight: 600; }

/* projects */
.projects { display: grid; gap: 28px; }
.project { display: grid; grid-template-columns: 1fr 1.05fr; padding: 0; }
.project .shot { position: relative; min-height: 340px; background: linear-gradient(150deg, color-mix(in srgb, var(--accent) 20%, var(--bg2)), color-mix(in srgb, var(--warm) 14%, var(--bg2))); overflow: hidden; display: flex; flex-direction: column; }
.project.flip .shot { order: 2; }
.browser { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid color-mix(in srgb, var(--fg) 12%, transparent); background: color-mix(in srgb, var(--bg) 40%, transparent); position: relative; z-index: 2; }
.browser i { width: 10px; height: 10px; border-radius: 50%; background: color-mix(in srgb, var(--fg) 30%, transparent); }
.browser span { margin-left: 8px; font: 400 .78rem/1 var(--font-mono); color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.live-tag { margin-left: auto; display: inline-flex; align-items: center; gap: 7px; font: 500 .7rem/1 var(--font-mono); color: var(--ok); text-transform: uppercase; letter-spacing: .1em; flex: none; }
.live-tag .dot { width: 7px; height: 7px; background: var(--ok); }
.shot svg { position: absolute; inset: 44px 0 0 0; width: 100%; height: calc(100% - 44px); }
.project .body { padding: clamp(22px, 3.4vw, 36px); display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.project h3 { font-size: clamp(1.45rem, 3vw, 2rem); margin: 0; }
.project .tag { color: var(--muted); }
.badges { display: flex; flex-wrap: wrap; gap: 8px; }
.badges span { font: 500 .72rem/1 var(--font-mono); padding: 7px 10px; border-radius: 999px; background: color-mix(in srgb, var(--warm) 14%, transparent); color: var(--warm); text-transform: uppercase; letter-spacing: .06em; }
.stack { display: flex; flex-wrap: wrap; gap: 8px; }
.stack span { font: 500 .76rem/1 var(--font-mono); padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, transparent); }
.pstats { display: flex; gap: 28px; flex-wrap: wrap; }
.pstats div { font: 800 1.9rem/1 var(--font-display); letter-spacing: -.03em; color: var(--accent); font-variant-numeric: tabular-nums; }
.pstats div span { display: block; margin-top: 6px; font: 400 .76rem/1.3 var(--font-mono); color: var(--muted); letter-spacing: 0; }
.project .cta { margin-top: auto; padding-top: 6px; }
.btn.sm { padding: 12px 18px; font-size: .92rem; border-radius: 12px; }

.bubble { animation: float 5s ease-in-out infinite; }
.pulse { animation: pulse 2.4s ease-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes pulse { 0% { transform: scale(.6); opacity: .9; } 100% { transform: scale(2.4); opacity: 0; } }
.dash { stroke-dasharray: 8 10; animation: dash 1.4s linear infinite; }
@keyframes dash { to { stroke-dashoffset: -36; } }
.tog { animation: tog 3.6s ease-in-out infinite; }
@keyframes tog { 0%, 40% { transform: translateX(0); } 55%, 100% { transform: translateX(12px); } }
.garment { animation: float 5s ease-in-out infinite; }

/* skills */
.skills-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 20px; }
.chips { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
.chip { font: 500 .9rem/1 var(--font-body); padding: 10px 14px; border-radius: 999px; background: color-mix(in srgb, var(--accent) 9%, var(--bg)); border: 1px solid var(--line); transition: transform .35s var(--ease), background .3s, border-color .3s, color .3s; }
.chip:hover { transform: translateY(-3px) scale(1.04); background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.skills-grid .card h3 { display: flex; align-items: center; gap: 10px; font-size: 1.12rem; }
.skills-grid .card h3 i { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 5px color-mix(in srgb, var(--accent) 20%, transparent); }
.ai-card { grid-column: 1 / -1; display: grid; grid-template-columns: auto 1fr; gap: 22px; align-items: center; border: 0; background: transparent; padding: 2px; }
.ai-card::before { content: ""; position: absolute; inset: 0; border-radius: 20px; background: conic-gradient(from var(--a), var(--accent), var(--warm), var(--bg) 40%, var(--accent)); animation: spin 6s linear infinite; z-index: 0; }
.ai-card .in { position: relative; z-index: 1; background: var(--surface); border-radius: 18px; padding: clamp(20px, 3vw, 28px); display: flex; gap: 22px; align-items: center; flex-wrap: wrap; width: 100%; grid-column: 1 / -1; }
@property --a { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
@keyframes spin { to { --a: 360deg; } }
.ai-card .spark { width: 54px; height: 54px; border-radius: 16px; display: grid; place-items: center; background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); flex: none; }
.ai-card .spark svg { width: 28px; height: 28px; animation: twinkle 3s ease-in-out infinite; }
@keyframes twinkle { 50% { transform: scale(1.18) rotate(12deg); } }
.ai-card h3 { margin: 0 0 4px; }
.ai-card p { color: var(--muted); }
.ai-card .txt { flex: 1 1 280px; min-width: 0; }
.ai-card:hover { transform: none; }

/* about */
.about-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.about-intro { grid-column: 1 / -1; display: grid; grid-template-columns: 1.3fr 1fr; gap: clamp(20px, 4vw, 48px); align-items: start; margin-bottom: 8px; }
.about-intro p { font: 500 clamp(1.1rem, 2.3vw, 1.45rem)/1.5 var(--font-display); letter-spacing: -.012em; }
.about-intro p em { font-style: normal; color: var(--accent); }
.seek { border: 1px solid color-mix(in srgb, var(--ok) 40%, var(--line)); background: color-mix(in srgb, var(--ok) 7%, var(--surface
