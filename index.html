<title>Deep Lokhande</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: hero with a clean portrait panel, a proof strip of real numbers, then Projects, Skills, About, GitHub, Contact. Midnight ground, cyan as the working accent, coral as the single warm highlight. */
:root {
  --bg: #070c13;
  --bg2: #0a121b;
  --surface: #0f1923;
  --line: #1d2c3b;
  --fg: #eaf1f7;
  --muted: #8da2b5;
  --accent: #34d3ef;
  --accent-ink: #02171d;
  --warm: #ff6f5e;
  --ok: #3ddc97;
  --font-display: "Sora", "Segoe UI", system-ui, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --ease: cubic-bezier(.22, 1, .36, 1);
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f3f6f9; --bg2: #e9eff4; --surface: #ffffff; --line: #d2dce6;
    --fg: #0d1b27; --muted: #475c70; --accent: #0a7e96; --accent-ink: #ffffff; --warm: #d3402f; --ok: #11875a;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f3f6f9; --bg2: #e9eff4; --surface: #ffffff; --line: #d2dce6;
  --fg: #0d1b27; --muted: #475c70; --accent: #0a7e96; --accent-ink: #ffffff; --warm: #d3402f; --ok: #11875a;
  color-scheme: light;
}
